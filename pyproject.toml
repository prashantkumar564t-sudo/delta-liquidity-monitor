[project]
name = "delta-liquidity-monitor"
version = "0.1.0"
description = "Delta Exchange Quantitative Microstructure Monitor & Options Profiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "E402", "B008", "B905", "SIM108", "W291", "W293"]
